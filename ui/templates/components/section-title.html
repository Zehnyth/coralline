{{/* section-title: dict Title, Count (string, optional), Description
     (optional). The page's h1 on list-style pages. */}}
{{define "section-title"}}<div class="section-title"><h1>{{.Title}}{{with .Count}} <span class="count">{{.}}</span>{{end}}</h1>{{with .Description}}<p>{{.}}</p>{{end}}</div>{{end}}
